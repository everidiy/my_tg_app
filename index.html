<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Monster Collection</title>
    <!-- Официальный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель навигации -->
        <aside class="sidebar">
            <div class="logo">
                <span class="monster-text">M</span><span class="miku-text">M</span>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" data-tab="gallery">
                    <span class="icon">🖼️</span>
                    <span class="btn-text">Gallery</span>
                </button>
                <button class="nav-btn" data-tab="profile">
                    <span class="icon">👤</span>
                    <span class="btn-text">Profile</span>
                </button>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="content-area">
            <!-- Вкладка: Галерея -->
            <section id="gallery" class="tab-content active">
                <div class="title_badges">
                    <select class="variants" onchange="filterAllCards()">
                        <option value="all" selected>All</option>
                        <option value="ultra">Ultra</option>
                        <option value="juiced">Juiced</option>
                        <option value="classic">Classic</option>
                        <option value="nitro">Nitro</option>
                        <option value="vr46">VR46</option>
                    </select>
                </div>
                <div class="gallery-grid">
                    <!-- Резервная карточка на случай, если сервер лежит -->
                    <div class="card card-monster">
                        <div class="card-image">🟢</div>
                        <div class="card-info">
                            <h3>Monster Energy Original</h3>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Вкладка: Профиль -->
            <section id="profile" class="tab-content">
                <div class="profile-container">
                    <div class="avatar-block">
                        <!-- Синхронизировано со скриптом -->
                        <div class="avatar" id="profile-avatar">
                            <span>?</span>
                        </div>
                        <h2 id="profile-name">Telegram User</h2>
                    </div>

                    <!-- НОВЫЙ БЛОК: Статистика пользователя -->
                    <div class="profile-stats">
                        <div class="stat-item">
                            <span class="stat-label">Total cans</span>
                            <!-- Класс nums-of-cans связан с вашей функцией countCans() -->
                            <span class="stat-value nums-of-cans">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Average rating</span>
                            <!-- Новый id для вывода среднего рейтинга -->
                            <span class="stat-value" id="avg-rating">0.0</span>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>
</body>
</html>
