<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster x Miku WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель навигации -->
        <aside class="sidebar">
            <div class="logo">
                <span class="monster-text">M</span><span class="miku-text">M</span>
            </div>
            <nav class="nav-menu">
                <button class="nav-btn active" data-tab="gallery">
                    <span class="icon">🖼️</span>
                    <span class="btn-text">Gallery</span>
                </button>
                <button class="nav-btn" data-tab="profile">
                    <span class="icon">👤</span>
                    <span class="btn-text">Profile</span>
                </button>
            </nav>
        </aside>

        <!-- Основной контент -->
        <main class="content-area">
            <!-- Вкладка: Галерея -->
            <section id="gallery" class="tab-content active">
                <h1 class="page-title">Gallery</h1>
                <div class="gallery-grid">
                    <div class="card card-monster">
                        <div class="card-image">🟢</div>
                        <div class="card-info">
                            <h3>Monster Energy Original</h3>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Вкладка: Профиль -->
            <section id="profile" class="tab-content">
                <h1 class="page-title">Profile</h1>
                <div class="profile-container">
                    <div class="avatar-block">
                        <div class="avatar" id="user-avatar">
                            <img id="user-photo" src="" alt="Avatar" style="display: none; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                            <span id="avatar-text">?</span>
                        </div>
                        <h2 id="username">Telegram User</h2>
                    </div>

                </div>
            </section>
        </main>
    </div>
</body>
</html>
